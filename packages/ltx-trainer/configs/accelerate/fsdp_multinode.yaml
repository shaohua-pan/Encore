compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
enable_cpu_affinity: false
fsdp_config:
  fsdp_activation_checkpointing: false
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_cpu_ram_efficient_loading: true
  fsdp_forward_prefetch: false
  fsdp_offload_params: true
  fsdp_reshard_after_forward: FULL_SHARD
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_transformer_layer_cls_to_wrap: BasicAVTransformerBlock
  fsdp_use_orig_params: true
  fsdp_version: 1
# --- 多机配置（启动前按实际环境修改） ---
machine_rank: 0              # 当前节点编号：主节点填 0，其余节点依次填 1,2,...
num_machines: 2              # 总节点数
num_processes: 16            # 所有节点 GPU 总数（num_machines × 每节点GPU数）
main_process_ip: "127.0.0.1" # 主节点（machine_rank=0）的 IP 地址
main_process_port: 29500     # 通信端口，确保所有节点网络可达
rdzv_backend: c10d           # 多机必须用 c10d，不能用 static
# -----------------------------------------
main_training_function: main
mixed_precision: bf16
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
